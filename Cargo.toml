[package]
name = "github-turbo"
version = "0.5.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "fs", "time", "sync", "signal"] }
tokio-native-tls = "0.3"
native-tls = { version = "0.2", features = ["alpn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
rcgen = { version = "0.13", features = ["x509-parser"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hickory-proto = { version = "0.24", default-features = false }
time = "0.3"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
http-body-util = "0.1"
bytes = "1"
percent-encoding = "2"
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

